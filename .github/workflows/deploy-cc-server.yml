name: Deploy cc-server to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: cc-server
  REGION: us-central1
  REPO_HOST: us-central1-docker.pkg.dev
  REPO_NAME: cc-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REPO_HOST }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (apps/backend)
        working-directory: apps/backend
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          REPO_HOST: ${{ env.REPO_HOST }}
          REPO_NAME: ${{ env.REPO_NAME }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        run: |
          IMAGE_URI="$REPO_HOST/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:${GITHUB_SHA}"
          docker buildx build -t "$IMAGE_URI" --push .
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "\
              NODE_ENV=production,\
              AUTH_SECRET=${{ secrets.AUTH_SECRET }},\
              DATABASE_URL=${{ secrets.DATABASE_URL }},\
              GCLOUD_PROJECT_ID=${{ env.PROJECT_ID }},\
              GCLOUD_BUCKET=${{ secrets.GCLOUD_BUCKET }},\
              GCS_CLIENT_EMAIL=${{ secrets.GCS_CLIENT_EMAIL }},\
              GCS_PRIVATE_KEY=${{ secrets.GCS_PRIVATE_KEY }}\
            "
